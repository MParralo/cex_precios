name: Escáner CeX 24/7

# Lo dispara el repo público precios_disparador (cron fiable).
# También se puede lanzar a mano desde la pestaña Actions.
on:
  workflow_dispatch:

jobs:
  check-cex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar escáner CeX
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python monitor_cex.py

      - name: Guardar historial
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "actualizar historial CeX [skip ci]"
          file_pattern: vistos.json estado.json
